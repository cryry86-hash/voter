name: Trigger Next Run
on:
  workflow_run:
    workflows: ["Run Kokushibo Official Voter"]
    types:
      - completed

jobs:
  start-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub to restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run run_voter.yml
