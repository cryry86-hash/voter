name: Trigger Next Run
on:
  workflow_run:
    workflows: ["Run Kokushibo Official Voter"]
    types:
      - completed

# This section gives the file permission to trigger the next run
permissions:
  actions: write

jobs:
  start-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Ping GitHub to restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run run_voter.yml --repo ${{ github.repository }}
